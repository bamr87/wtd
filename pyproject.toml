[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wtd"
version = "0.1.0"
description = "WTD – What To Do: The Ultimate Recursive TODO Engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "WTD Team" }
]
keywords = ["todo", "ai", "automation", "productivity", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "textual>=0.47.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "ollama>=0.1.6",
    "openai>=1.6.0",
    "gitpython>=3.1.40",
    "watchfiles>=0.21.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.25",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
wtd = "wtd.cli:app"

[project.urls]
Homepage = "https://github.com/wtd/wtd"
Documentation = "https://wtd.dev/docs"
Repository = "https://github.com/wtd/wtd"

[tool.hatch.build.targets.wheel]
packages = ["wtd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

